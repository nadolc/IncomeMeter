# Builds the IncomeMeter Android app as an installable APK (no Expo/EAS account needed).
# Run it from the Actions tab → "Android APK" → Run workflow, then download the "IncomeMeter-apk" artifact.
#
# Signing: the release build uses the Android debug key that `expo prebuild` generates from Expo's template.
# It is the same on every build, so a new APK installs over the old one and keeps the app's data – but the
# key is public, so this APK is for personal / sideloaded use, not for Google Play.
# Maps: set a repository secret GOOGLE_MAPS_API_KEY (Maps SDK for Android) to draw route maps; without it the
# route screen lists the points instead.

name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-apk.yml

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: IncomeMeterExpo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: IncomeMeterExpo/package-lock.json

      # Same as the iOS workflow: the lockfile is written by npm 11.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        env:
          CI: '1'
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (arm64 phones)
        working-directory: IncomeMeterExpo/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Show signing certificate (same fingerprint on every build = installs over the previous APK)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i "SHA-256" || true
          cp "$APK" "$RUNNER_TEMP/IncomeMeter.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IncomeMeter-apk
          path: ${{ runner.temp }}/IncomeMeter.apk
          retention-days: 30
