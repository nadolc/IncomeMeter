# Builds the IncomeMeter iPhone app as an UNSIGNED .ipa on a GitHub-hosted Mac, for installing with
# SideStore / AltStore and a free Apple ID (no Apple Developer account, no Mac of your own).
# Run it from the Actions tab → "iOS unsigned IPA" → Run workflow, then download the "IncomeMeter-ipa" artifact.
# See IncomeMeterExpo/SIDELOAD.md.

name: iOS unsigned IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-unsigned-ipa.yml

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: IncomeMeterExpo

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: IncomeMeterExpo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/IncomeMeter.xcworkspace \
            -scheme IncomeMeter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/IncomeMeter.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Package .ipa
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R IncomeMeter.xcarchive/Products/Applications/IncomeMeter.app Payload/
          zip -qry IncomeMeter.ipa Payload
          ls -lh IncomeMeter.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IncomeMeter-ipa
          path: ${{ runner.temp }}/IncomeMeter.ipa
          retention-days: 30
